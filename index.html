
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #234;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .add-btn {
            background: #287a4b;
            width: 100%;
        }

        .delete-btn {
            background: #d93636;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #234;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }
    </style>
</head>

<body>

    <h1>Library Management System</h1>

    <div class="container">
        <h2>Add a Book</h2>

        <input type="text" id="bookName"
               placeholder="Enter book name">

        <input type="text" id="authorName"
               placeholder="Enter author name">

        <button class="add-btn" onclick="addBook()">
            Add Book
        </button>

        <h2>Book List</h2>

        <table>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Book Name</th>
                    <th>Author</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="bookList"></tbody>
        </table>
    </div>

    <script>
        let books = [];

        function addBook() {
            const bookName =
                document.getElementById("bookName").value.trim();

            const authorName =
                document.getElementById("authorName").value.trim();

            if (bookName === "" || authorName === "") {
                alert("Please enter the book name and author name.");
                return;
            }

            books.push({
                name: bookName,
                author: authorName
            });

            document.getElementById("bookName").value = "";
            document.getElementById("authorName").value = "";

            displayBooks();
        }

        function displayBooks() {
            const bookList = document.getElementById("bookList");
            bookList.replaceChildren();

            books.forEach((book, index) => {
                const row = document.createElement("tr");

                [index + 1, book.name, book.author].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");

                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";

                deleteButton.onclick = function () {
                    books.splice(index, 1);
                    displayBooks();
                };

                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);
                bookList.appendChild(row);
            });
        }
    </script>

</body>
</html>
